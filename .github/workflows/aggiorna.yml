# Legge i feed e pubblica il sito su GitHub Pages.
# Aggiornamento automatico sospeso su richiesta dell'utente (25/11/2026):
# il workflow parte solo a mano dalla scheda Actions. Per riattivarlo
# ripristinare i blocchi schedule (cron '7,37 * * * *') e push su main.
name: Aggiorna e pubblica

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione per volta: quella in corso finisce, la successiva aspetta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Prove automatiche
        if: github.event_name != 'schedule'
        run: npm test

      # Ultimo risultato valido di ogni fonte e registro degli errori,
      # conservati da un'esecuzione alla successiva.
      - uses: actions/cache@v6
        with:
          path: dati
          key: dati-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dati-

      # Se nessuna fonte risponde il comando fallisce e il sito pubblicato
      # resta quello dell'ultimo aggiornamento riuscito.
      - name: Lettura dei feed
        run: npm run feed -- --elenco

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: sito

      - id: deployment
        uses: actions/deploy-pages@v4
